<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="Home.css">
    <style>
        .status-indicator {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background-color: green;
            border: 2px solid white;
            border-radius: 50%;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <h2>Friend List</h2>
    <h2 id="loggedInUserName" style="color: red"></h2>
    <div id="user-card-container">
    </div>

    <label for="username">Username</label>
    <input type="text" placeholder="username" id="username" />

    <label for="password">Password</label>
    <input type="password" placeholder="password" id="password" />
    <button onclick="login()">Login</button>
</div>

<div class="chat-view">
    <h2 id="chat-with">Chat View</h2>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Nhập tin nhắn..." />
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0-beta2/bundles/stomp.umd.min.js"></script>
<!-- Code JavaScript riêng biệt -->
<script type="application/javascript">

    let stompClient;
    let onlineUsers = new Set();
    let subscribed = new Map();
    let token;
    async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const data = {
            username: username,
            password: password
        };

        try {
            const response = await fetch("http://localhost:8080/users/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const responseData = await response.json();
            token = responseData.token
            document.getElementById("loggedInUserName").innerText = `Logged User: ${responseData.username}`;
            try {
                const onlineUserResponse = await fetch("http://localhost:8080/users/friends", {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${responseData.token}` // Thêm token vào request
                    }
                });
                sessionStorage.setItem("userToken", responseData.token)
                sessionStorage.setItem("loggedInUserId", responseData.userId)
                const data = await onlineUserResponse.json()
                const userCardWrapper = document.getElementById("user-card-container");

                if (data.length > 0) {
                    // Hiển thị container khi có dữ liệu user
                    userCardWrapper.innerHTML = "";
                    userCardWrapper.style.display = "block";
                    data.forEach(user => {
                        const userCard = document.createElement("div");
                        const isOnline = user.online ? "status-indicator" : ""
                        userCard.className = "user-card";
                        userCard.setAttribute("data-user-id", user.otherSideUserId);
                        userCard.setAttribute("conversation-id", user.convId);
                        userCard.innerHTML = `
                        <div style="display: flex; align-items: center;">
                            <div class="avatar" style="margin-right: 10px;">
                                <img src="${user.otherSideUserAvatar}" alt="Avatar" style="width: 40px; height: 40px; border-radius: 50%;">
                                <div id="status-${user.otherSideUserId}" class="${isOnline}"></div>
                            </div>
                            <div>
                                <h3 style="margin: 0;">${user.otherSideUserName}</h3>
                            </div>
                                <div class="notification-dot" id="notify-${user.id}"></div>
                        </div>`;
                        userCardWrapper.appendChild(userCard);
                        userCard.addEventListener("click", () => {
                            document.getElementById("chat-with").textContent = `Chat with: ${user.otherSideUserName}`
                            // Lưu vào Session Storage
                            sessionStorage.setItem("currentReceiverId", user.otherSideUserId);
                            sessionStorage.setItem("currentConversationId", user.convId);
                            let subscription = stompClient.subscribe("/topic/" + user.convId, (message) => {
                                const receivedMessage = JSON.parse(message.body);
                                receiveMessage(receivedMessage);
                            })
                            stompClient.subscribe("/topic/notification/" + user.convId, (message) => {
                                const notification = JSON.parse(message.body);
                                const currentLoggedInUser = sessionStorage.getItem("loggedInUserId");
                                console.log(notification)
                                if(notification) {
                                    if(notification.friendId === currentLoggedInUser && notification.deliveryStatus === "SEEN") {
                                        updateSentMessages(notification.deliveryStatus)
                                    }
                                }
                            })
                            if(subscription) {
                                const notificationToUser = {
                                    friendId : user.otherSideUserId,
                                    deliveryStatus : "SEEN",
                                }
                                stompClient.publish({
                                    destination: `/app/chat/notification/${user.convId}`,
                                    body: JSON.stringify(notificationToUser)
                                })
                            }
                            loadMessage(user.convId);
                        });
                    })
                }
            }catch (error){
                console.log("Fetch error: ", error)
            }
            const config = {
                brokerURL: "ws://127.0.0.1:8080/ws",
                connectHeaders: {
                    Authorization: `Bearer ${responseData.token}`
                }
            }
            stompClient = new StompJs.Client(config)
            stompClient.onConnect = () => {
                stompClient.subscribe("/topic/" + responseData.userId, (message) => {
                    const messageData = JSON.parse(message.body);
                    if(messageData.friendStatus === "ONLINE") {
                        onlineUsers.add(messageData.friendId)
                        updateSentMessages("DELIVERED")
                        document.getElementById(`status-${messageData.friendId}`).classList.add("status-indicator")
                    }else {
                        document.getElementById(`status-${messageData.friendId}`).classList.remove("status-indicator")
                    }
                });
            }
            stompClient.onStompError = (frame) => {
                console.error('❌ Lỗi STOMP:', frame.headers['message']);
            };

            stompClient.activate();
            localStorage.setItem("loginResponse", JSON.stringify(responseData))
        } catch (error) {
            console.error("Lỗi đăng nhập:", error);
        }
    }
    async function loadMessage(conversationId) {
        try {
            const messages = await fetch(`http://localhost:8080/chats?convId=${conversationId}`, { method: "GET",
                headers: {
                "Authorization": `Bearer ${token}`
            }});
            const messagesResponse = await messages.json();
            const currentChatWithUserId = sessionStorage.getItem("currentReceiverId");
            const chatMessages = document.getElementById("chat-messages");
            chatMessages.innerHTML = "";

            messagesResponse.forEach((message, index) => {
                const messageElement = document.createElement("div");
                messageElement.classList.add("message");

                if (message.fromUser === currentChatWithUserId) {
                    messageElement.classList.add("received");
                } else {
                    messageElement.classList.add("sent");
                }

                // Nội dung tin nhắn
                messageElement.textContent = message.content;

                // Nếu là tin nhắn cuối cùng bạn gửi, thêm nhãn trạng thái
                if (message.fromUser !== currentChatWithUserId && index === messagesResponse.length - 1) {
                    const statusSpan = document.createElement("span");
                    statusSpan.classList.add("delivery-status");
                    statusSpan.textContent = message.deliveryStatus; // SENT, DELIVERED, SEEN
                    statusSpan.style.color = "green" // SENT, DELIVERED, SEEN
                    messageElement.appendChild(statusSpan);
                }

                chatMessages.appendChild(messageElement);
            });

            // Tự động cuộn xuống tin nhắn mới nhất
            chatMessages.scrollTop = chatMessages.scrollHeight;

        } catch (error) {
            alert(error);
        }
    }

    function sendMessage() {
        const messageInput = document.getElementById("messageInput");
        const messageContent = messageInput.value.trim();
        const chatMessages = document.getElementById("chat-messages");

        if (messageContent !== "") {
            const messageElement = document.createElement("div");
            messageElement.classList.add("message", "sent");
            messageElement.textContent = messageContent;
            chatMessages.appendChild(messageElement);
            const senderId = sessionStorage.getItem("loggedInUserId")
            const receiverId = sessionStorage.getItem("currentReceiverId");
            const conversationId = sessionStorage.getItem("currentConversationId");
            const message = {
                fromUser : senderId,
                toUser : receiverId,
                content : messageContent,
                messageType : "TEXT",
            }
            stompClient.publish({
                destination: `/app/chat/sendMessage/${conversationId}`,
                body: JSON.stringify(message)
            });
            messageInput.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        // Simulate receiving a message after 1 second
    }
    function updateSentMessages(status) {
        const chatMessages = document.querySelectorAll('#chat-messages .message');
        let lastReceivedIndex = -1;

        // 🔍 Xác định vị trí cuối cùng của tin nhắn từ người kia
        chatMessages.forEach((msg, index) => {
            if (msg.classList.contains('received')) {
                lastReceivedIndex = index;
            }
        });

        // 🎯 Lấy và cập nhật tất cả tin nhắn mình gửi sau tin nhắn cuối cùng của người kia
        const messagesAfterReceived = Array.from(chatMessages).slice(lastReceivedIndex + 1)
            .filter(msg => msg.classList.contains('sent'));
        console.log(messagesAfterReceived);
        messagesAfterReceived.forEach(msg => {
            msg.setAttribute("data-status", status);
            msg.setAttribute("title", status);
            console.log(msg)
            // 🎨 Hiển thị trạng thái SEEN dưới tin nhắn
            let statusElement = msg.querySelector('.delivery-status');
            if(statusElement) {
                statusElement.textContent = status;
                statusElement.style.color = "green"
                statusElement.style.alignItems = "right"
            }
        });
        console.log(`✅ ${messagesAfterReceived.length} tin nhắn đã được cập nhật trạng thái SEEN.`);
    }

    function updateMessageStatus(messageId, newStatus) {
        const messageElement = document.querySelector(`[message-id="${messageId}"]`);
        if (messageElement) {
            messageElement.setAttribute("data-status", newStatus);
            messageElement.setAttribute("title", newStatus.replace("_", " ")); // Tooltip

            // 🔄 Tìm hoặc tạo thẻ trạng thái
            let statusElement = messageElement.querySelector(".delivery-status");
            if (!statusElement) {
                statusElement = document.createElement("span");
                statusElement.className = "delivery-status";
                messageElement.appendChild(statusElement);
            }

            // 🎨 Cập nhật nội dung trạng thái
            switch (newStatus) {
                case "NOT_DELIVERED":
                    statusElement.textContent = "❌ Not Delivered";
                    statusElement.style.color = "red";
                    break;
                case "DELIVERED":
                    statusElement.textContent = "✅ Delivered";
                    statusElement.style.color = "blue";
                    break;
                case "SEEN":
                    statusElement.textContent = "👀 Seen";
                    statusElement.style.color = "green";
                    updateSentMessages(newStatus);
                    break;
            }
            console.log(`✅ Tin nhắn ${messageId} đã được cập nhật trạng thái: ${newStatus}`);
        } else {
            console.log(`❌ Không tìm thấy tin nhắn với ID: ${messageId}`);
        }
    }

    function receiveMessage(message) {
        const chatMessages = document.getElementById("chat-messages");
        const messageElement = document.createElement("div");
        const currentChatWithUserId = sessionStorage.getItem("currentReceiverId")
        if(message.fromUser === currentChatWithUserId) {
            messageElement.classList.add("message", "received");
            messageElement.textContent = message.content;

            chatMessages.appendChild(messageElement);

        }else{
            const chatMessages = document.getElementById("chat-messages");
            const allMessages = chatMessages.querySelectorAll(".message");
            if (allMessages.length > 0) {
                const lastMessage = allMessages[allMessages.length - 1];
                lastMessage.setAttribute("message-id", message.id);
                updateMessageStatus(message.id,message.deliveryStatus )
            }
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>
</body>
</html>
